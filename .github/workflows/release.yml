name: release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ "$tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            prerelease=false
            make_latest=true
            channel=stable
          elif [[ "$tag" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9A-Za-z][0-9A-Za-z.-]*)$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-${BASH_REMATCH[4]}"
            prerelease=true
            make_latest=false
            channel=prerelease
          else
            echo "Unsupported release tag: $tag" >&2
            echo "Expected x.y.z or x.y.z-suffix, optionally prefixed with v." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

          echo "Tag $tag => $channel release $version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test subtitle conversion
        run: node tests/subtitle-unscrambler.test.js

      - name: Restore .NET dependencies
        run: dotnet restore src/Emby.SubtitleUnscrambler/Emby.SubtitleUnscrambler.csproj

      - name: Build plugin
        run: >-
          dotnet build
          src/Emby.SubtitleUnscrambler/Emby.SubtitleUnscrambler.csproj
          --configuration Release
          --no-restore

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.channel.outputs.version }}"
          mkdir -p dist
          cd src/Emby.SubtitleUnscrambler/bin/Release/netstandard2.0
          cp Emby.SubtitleUnscrambler.dll "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE"
          zip -j "dist/Emby.SubtitleUnscrambler-${version}.zip" \
            README.md LICENSE CHANGELOG.md \
            dist/Emby.SubtitleUnscrambler.dll

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.channel.outputs.version }}"
          is_prerelease="${{ steps.channel.outputs.prerelease }}"
          make_latest="${{ steps.channel.outputs.make_latest }}"
          title="Emby Subtitle Unscrambler $version"

          if [[ "$is_prerelease" == "true" ]]; then
            title="$title (Pre-release)"
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [[ "$is_prerelease" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$title" \
              --prerelease \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$title" \
              --generate-notes
          fi

          printf '{"name":"%s","prerelease":%s,"make_latest":"%s"}' \
            "$title" "$is_prerelease" "$make_latest" |
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --input -
